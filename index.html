    <!-- Primary Meta Tags -->

    <meta name="description" content="Authenex is a professional forensic tool using neural analysis to distinguish between authentic human photography and AI-generated deepfakes.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700&display=swap');
        
        :root {
            --bg-main: #020617;
            --text-main: #f8fafc;
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(51, 65, 85, 0.5);
            --accent-glow: rgba(56, 189, 248, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
            margin: 0;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }

        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        .scanner-line {
            height: 2px;
            background: linear-gradient(to right, transparent, #38bdf8, transparent);
            box-shadow: 0 0 15px #38bdf8;
            position: absolute;
            width: 100%;
            z-index: 10;
            animation: scan 3s linear infinite;
        }
    </style>
